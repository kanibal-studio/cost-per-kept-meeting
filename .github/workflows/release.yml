name: Release to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  ci:
    # Nothing is published if the tests or the build fail.
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    # GitHub environment "pypi": maintainer approval is required before any
    # publication, v* tags only. The PyPI trusted publisher is bound to this
    # environment: a job that does not declare it cannot publish.
    environment:
      name: pypi
      url: https://pypi.org/project/cost-per-kept-meeting/
    permissions:
      id-token: write  # Trusted Publishing (OIDC), no stored token
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: The tag must match the package version
        run: |
          version="$(python -c 'import cost_per_kept_meeting; print(cost_per_kept_meeting.__version__)')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${version} (cost_per_kept_meeting.py)"
            exit 1
          fi
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
